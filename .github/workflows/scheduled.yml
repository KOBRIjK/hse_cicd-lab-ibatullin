name: Scheduled

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Набор тестов"
        type: choice
        options: [all, smoke]
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Smoke tests
        if: github.event.inputs.suite == 'smoke'
        run: pytest app/tests -v -k test_add

      - name: Full tests
        if: github.event_name == 'schedule' || github.event.inputs.suite == 'all'
        run: pytest app/tests -v
